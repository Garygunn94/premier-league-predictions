name: Club videos

# "Club DNA": one narrated video per Premier League club on what makes them the side they are
# (plpred/dna.py). They stay true for months, so they're made only when asked: run this by hand
# from the Actions tab, for every club or just the ones named. Four runners share the clubs,
# so all twenty take about fifteen minutes. The videos and their captions come back as one zip
# attached to the run, locked with the KIT_PASSWORD secret like the posting kit.

on:
  workflow_dispatch:
    inputs:
      clubs:
        description: "Only these clubs, comma-separated (e.g. Arsenal, Man United). Empty for all."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -r requirements.txt kokoro-onnx==0.6.1 soundfile==0.14.0 playwright==1.64.0
          python -m playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0
      # Google Cloud Text-to-Speech reads the videos when GOOGLE_TTS_API_KEY is set; otherwise,
      # or if Google fails, Kokoro does (as for the weekly videos).
      - name: Make this runner's share of the videos
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          CLUBS: ${{ inputs.clubs }}
        run: |
          if [ -n "$CLUBS" ]; then
            IFS=',' read -ra picked <<< "$CLUBS"
            only=(); for c in "${picked[@]}"; do c="$(echo "$c" | xargs)"; [ -n "$c" ] && only+=("$c"); done
            python -m plpred.dna out/club-dna --shard ${{ matrix.shard }}/4 --only "${only[@]}"
          else
            python -m plpred.dna out/club-dna --shard ${{ matrix.shard }}/4
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: club-dna-${{ matrix.shard }}
          path: out/club-dna/ready
          if-no-files-found: ignore
          retention-days: 1

  # The repository is public, so anyone signed in to GitHub could download a plain artifact:
  # the four shares are joined into one zip locked with KIT_PASSWORD.
  lock:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: club-dna-*
          path: club-videos
          merge-multiple: true
      - name: Lock the videos
        env:
          KIT_PASSWORD: ${{ secrets.KIT_PASSWORD }}
        run: |
          if [ -z "$KIT_PASSWORD" ]; then
            echo "::error::KIT_PASSWORD is not set, so the club videos can't be attached safely."
            exit 1
          fi
          ls club-videos
          7z a -tzip -mem=AES256 -p"$KIT_PASSWORD" club-videos.zip club-videos > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: club-videos
          path: club-videos.zip
          retention-days: 30
