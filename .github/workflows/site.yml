name: Publish site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update data"]
    types: [completed]
  workflow_dispatch:
    inputs:
      email_kit:
        description: "Email the posting kit to KIT_EMAIL, one message per post"
        type: choice
        options: ["no", predictions, results, both]
        default: "no"
      videos:
        description: "Make the narrated videos for the posting kit (about 15 minutes)"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # after a data update, build from the commit it just pushed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m plpred.site
        env:
          # Optional repository variables (Settings > Secrets and variables > Actions > Variables).
          GOATCOUNTER: ${{ vars.GOATCOUNTER || 'garygunn94' }}
          NEWSLETTER_URL: ${{ vars.NEWSLETTER_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'hello@inkwellandalgorithm.com' }}
      - name: Install Playwright
        run: |
          pip install playwright==1.64.0
          python -m playwright install --with-deps chromium
      # Narrated videos (plpred.video) take about a minute and a half each, so they are made only
      # on the day the predictions edition is emailed and on manual runs with "Make the narrated
      # videos" ticked, not after the other daily refreshes. The Kokoro voice model (~350 MB) is
      # cached between runs.
      - name: Check whether to make the videos
        id: videos
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.videos }}" = true ]; then
            echo "make=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = workflow_run ] && [ "${{ github.event.workflow_run.event }}" = schedule ] \
               && python -m plpred.video site/social --due; then
            echo "make=true" >> "$GITHUB_OUTPUT"
          else
            echo "make=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@v4
        if: steps.videos.outputs.make == 'true'
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0
      # A failed video never holds up the site or the rest of the kit: the posts go out without it.
      - name: Make the narrated videos
        if: steps.videos.outputs.make == 'true'
        continue-on-error: true
        # Google Cloud Text-to-Speech reads the videos when the GOOGLE_TTS_API_KEY repository secret
        # is set; otherwise, or if Google fails, Kokoro does.
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install kokoro-onnx==0.6.1 soundfile==0.14.0
          python -m plpred.video site/social
      - name: Render the social media cards
        run: python -m plpred.social --png site/social
      # The posting kit also goes by email, one message per post, from and to the KIT_EMAIL Gmail
      # account (KIT_EMAIL_PASSWORD is a Gmail app password), in two editions: the predictions the
      # day before a round's first game and the results the day after its last. After each
      # scheduled daily update the edition due that day (if any) is sent; a manual run sends the
      # edition picked under "Email the posting kit". Never on a push to main.
      - name: Email the posting kit
        if: >-
          (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule')
          || (github.event_name == 'workflow_dispatch' && inputs.email_kit != 'no')
        env:
          KIT_EMAIL: ${{ secrets.KIT_EMAIL }}
          KIT_EMAIL_PASSWORD: ${{ secrets.KIT_EMAIL_PASSWORD }}
          KIT_EMAIL_TO: ${{ vars.KIT_EMAIL_TO }}
          EDITION: ${{ github.event_name == 'workflow_dispatch' && inputs.email_kit || 'due' }}
        run: python -m plpred.social --email site/social --edition "$EDITION"
      # The posting kit (captions, newsletter, every card) is private. Artifacts on a public
      # repository can be downloaded by anyone signed in to GitHub, so the kit is attached to this
      # run as a zip locked with the KIT_PASSWORD repository secret, and only when that secret is
      # set. Only the images the site uses as link previews stay on the public site.
      - name: Lock the posting kit
        env:
          KIT_PASSWORD: ${{ secrets.KIT_PASSWORD }}
        run: |
          if [ -z "$KIT_PASSWORD" ]; then
            echo "::warning::KIT_PASSWORD is not set, so the posting kit is not attached to this run."
          else
            (cd site && 7z a -tzip -mem=AES256 -p"$KIT_PASSWORD" ../posting-kit.zip social > /dev/null)
          fi
      - name: Attach the posting kit
        if: hashFiles('posting-kit.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: posting-kit
          path: posting-kit.zip
          retention-days: 30
      - name: Remove the posting kit from the public site
        run: |
          mkdir previews
          cp site/social/png/brand.png site/social/png/round.png site/social/png/call-*.png previews/
          rm -rf site/social
          mkdir -p site/social
          mv previews site/social/png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # After each data update, ask the Wayback Machine to save the front page and the newest
  # matchweek page, a dated copy of the calls as readers saw them (see plpred/proof.py).
  archive:
    needs: deploy
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m plpred.proof archive --site

  # A failed build or deploy raises an issue, so it reaches Gary by email; the next clean
  # run closes it.
  alert:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Raise or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ needs.build.result }}" = failure ] || [ "${{ needs.deploy.result }}" = failure ]; then
            .github/scripts/alert.sh open "Publish site needs a look"
          elif [ "${{ needs.deploy.result }}" = success ]; then
            .github/scripts/alert.sh close "Publish site needs a look"
          fi
