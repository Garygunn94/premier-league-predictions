name: Publish site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # after a data update, build from the commit it just pushed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m plpred.site
        env:
          # Optional repository variables (Settings > Secrets and variables > Actions > Variables).
          GOATCOUNTER: ${{ vars.GOATCOUNTER || 'garygunn94' }}
          NEWSLETTER_URL: ${{ vars.NEWSLETTER_URL }}
      - name: Render the social media cards
        run: |
          pip install playwright==1.64.0
          python -m playwright install --with-deps chromium
          python -m plpred.social --png site/social
      # The posting kit (captions, newsletter, every card) is private. Artifacts on a public
      # repository can be downloaded by anyone signed in to GitHub, so the kit is attached to this
      # run as a zip locked with the KIT_PASSWORD repository secret, and only when that secret is
      # set. Only the images the site uses as link previews stay on the public site.
      - name: Lock the posting kit
        env:
          KIT_PASSWORD: ${{ secrets.KIT_PASSWORD }}
        run: |
          if [ -z "$KIT_PASSWORD" ]; then
            echo "::warning::KIT_PASSWORD is not set, so the posting kit is not attached to this run."
          else
            (cd site && 7z a -tzip -mem=AES256 -p"$KIT_PASSWORD" ../posting-kit.zip social > /dev/null)
          fi
      - name: Attach the posting kit
        if: hashFiles('posting-kit.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: posting-kit
          path: posting-kit.zip
          retention-days: 30
      - name: Remove the posting kit from the public site
        run: |
          mkdir previews
          cp site/social/png/brand.png site/social/png/round.png site/social/png/call-*.png previews/
          rm -rf site/social
          mkdir -p site/social
          mv previews site/social/png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
