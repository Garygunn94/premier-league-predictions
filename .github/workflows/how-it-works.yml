name: How it works video

# "How it works": one narrated reel on how we call a game, from the data to the call and our record
# against the bookies (plpred/howitworks.py). Its league trends, worked example and record come from
# the data on the day, so run it by hand from the Actions tab every few months and the reel tells
# the season's latest story. The video and captions arrive as one email, from and to KIT_EMAIL like
# the weekly posting kit (KIT_EMAIL_PASSWORD, optional KIT_EMAIL_TO).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -r requirements.txt kokoro-onnx==0.6.1 soundfile==0.14.0 playwright==1.64.0
          python -m playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0
      # Google Cloud Text-to-Speech reads the video when GOOGLE_TTS_API_KEY is set; otherwise,
      # or if Google fails, Kokoro does (as for the weekly videos).
      - name: Make and email the video
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          KIT_EMAIL: ${{ secrets.KIT_EMAIL }}
          KIT_EMAIL_PASSWORD: ${{ secrets.KIT_EMAIL_PASSWORD }}
          KIT_EMAIL_TO: ${{ vars.KIT_EMAIL_TO }}
        run: python -m plpred.howitworks out/how-it-works --email
