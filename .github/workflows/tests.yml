name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  live-sources:
    # Checks every data source still answers and parses, without committing anything.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch into a scratch folder
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m plpred.update --data "$RUNNER_TEMP/data"
      - name: Summarise
        if: always()
        run: |
          find "$RUNNER_TEMP/data" -type f | sort | head -80
          python - <<'PY'
          import os, pandas as pd
          p = os.path.join(os.environ["RUNNER_TEMP"], "data", "matches.csv")
          if os.path.exists(p):
              m = pd.read_csv(p)
              print(m.groupby("season").agg(matches=("home_team", "size"), xg=("home_xg", "count"), odds=("odds_home", "count")).to_string())
          PY
