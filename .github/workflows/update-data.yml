name: Update data

on:
  schedule:
    - cron: "0 6 * * 4"           # Thursday 06:00 UTC: fresh data, then the week's calls
    - cron: "0 6 * * 0,1,2,3,5,6"  # every other morning: results, tables and record only
  workflow_dispatch:
    inputs:
      steps:
        description: "Steps to run (blank = all): xg history fpl fixtures"
        required: false
        default: ""
      predict:
        description: "Make this round's calls too (only needed if Thursday's run failed, or for a midweek round)"
        type: boolean
        default: false
      after_kickoff:
        description: "Also call this round's games that have already kicked off (a round first run late)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write  # to raise an issue when a run fails (see the last two steps)

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: prod  # holds the API_FOOTBALL_KEY secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m plpred.update ${{ inputs.steps }}
      # A source that breaks (Understat, say) fails this step and raises the issue below, but the
      # steps after it still run on the data that did arrive, so the week's calls and the kit
      # that depends on them still go out.
      # La Liga (data/laliga/): Understat and openfootball for the fixtures, football-data.co.uk for
      # results and odds. Its steps never stop the Premier League's; the health check reports them.
      - name: Fetch La Liga data
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python -m plpred.update --league la-liga ${{ inputs.steps }}
      # Calls are published once a week, on Thursday, and then stay as they are. The other
      # daily runs only bring in results, so the record, tables and projections stay current,
      # except that a round starting before the next Thursday (a midweek round) with no calls
      # yet is called the morning before its first game, in time for its predictions kit.
      - name: Call the games already under way
        if: ${{ !cancelled() && inputs.after_kickoff }}
        run: python -m plpred.predict --after-kickoff
      - name: Predict the coming round
        if: ${{ !cancelled() && (github.event.schedule == '0 6 * * 4' || inputs.predict) }}
        run: python -m plpred.predict
      - name: Predict a round starting tomorrow, if it has no calls yet
        if: ${{ !cancelled() && github.event.schedule != '0 6 * * 4' && !inputs.predict }}
        run: python -m plpred.predict --if-due
      # La Liga's model settings come from its own back-test: the first run makes them before any calls.
      - name: Predict La Liga
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          test -f data/laliga/backtest/settings.json || python -m plpred.backtest --data data/laliga
          python -m plpred.predict --data data/laliga ${{ (github.event.schedule == '0 6 * * 4' || inputs.predict) && ' ' || '--if-due' }}
      - name: Refresh our record
        if: ${{ !cancelled() }}
        run: python -m plpred.backtest
      - name: Refresh our La Liga record
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python -m plpred.backtest --data data/laliga
      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update data $(date -u +%Y-%m-%d)"
            git push
          fi
      # An independent, dated copy of the new calls that we can't edit afterwards: proof they
      # were made before kick-off (see plpred/proof.py). The Wayback Machine is sometimes slow or
      # busy, so this never fails the run.
      - name: Save the calls to the Internet Archive
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          calls=$(git diff --name-only ${{ github.sha }} HEAD -- data/predictions data/laliga/predictions)
          if [ -n "$calls" ]; then python -m plpred.proof archive --calls $calls; else echo "No new calls"; fi
      # A run can succeed and still bring in nothing, when a source stops updating or changes its
      # format. On Thursday this also checks the coming round was called; every day it checks a
      # round starting today or tomorrow was.
      - name: Check the data is healthy
        if: ${{ !cancelled() }}
        run: |
          status=0
          python -m plpred.health --report health.md $CALLS || status=1
          python -m plpred.health --data data/laliga --report laliga.md $CALLS || status=1
          cat laliga.md >> health.md
          exit $status
        env:
          CALLS: ${{ (github.event.schedule == '0 6 * * 4' || inputs.predict) && '--calls' || '' }}
      - name: Raise an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/alert.sh open "Update data needs a look" health.md
      - name: Close the issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/alert.sh close "Update data needs a look"
