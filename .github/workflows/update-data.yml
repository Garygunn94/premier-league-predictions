name: Update data

on:
  schedule:
    - cron: "0 6 * * 4"   # Thursday 06:00 UTC: the week's first look
    - cron: "0 7 * * 6"   # Saturday 07:00 UTC: late team news before kick-off
  workflow_dispatch:
    inputs:
      steps:
        description: "Steps to run (blank = all): xg history fpl fixtures"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m plpred.update ${{ inputs.steps }}
      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update data $(date -u +%Y-%m-%d)"
            git push
          fi
